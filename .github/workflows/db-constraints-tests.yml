name: db-constraints-tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  db-constraints-tests:
    name: db-constraints-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: inventory-api
    # DATABASE_URL is created by the verified disposable runner after checking
    # its runner-owned PostgreSQL name, marker and current_database() identity.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: inventory-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Run focused DB evidence on verified disposable PostgreSQL
        run: npm run test:disposable -- tests/p2-hardening-constraints.test.js tests/production-stage-rejection-migration.test.js tests/audit-repository.test.js
