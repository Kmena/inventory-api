name: windows-prisma-build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-prisma-build:
    name: windows-prisma-build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: inventory-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: inventory-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client on Windows
        run: npm run build
