# Dev-only Docker Compose file for local development.
# Canonical startup command from inventory-api/: docker compose -f docker-compose.dev.yml up --build
services:
  app:
    build: .
    ports:
      - "${PORT:-2500}:2500"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-2500}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracksys}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracksys}?schema=public
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:2500}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      BROWSER_SESSION_STORE_MODE: ${BROWSER_SESSION_STORE_MODE:-redis}
      REDIS_URL: redis://redis:6379/0
      HACIENDA_TAXPAYER_LOOKUP_URL: ${HACIENDA_TAXPAYER_LOOKUP_URL:-https://api.hacienda.go.cr/fe/ae?identificacion={identification}}
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksys}
      POSTGRES_USER: ${POSTGRES_USER:-tracksys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"

volumes:
  postgres_data:
