# Dev-only Docker Compose file for local development.
# Canonical startup command from inventory-api/: docker compose -f docker-compose.dev.yml up --build
services:
  app:
    build: .
    ports:
      - "${PORT:-2500}:2500"
    env_file:
      - .env
    environment:
      PORT: ${PORT:-2500}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:2500}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      HACIENDA_TAXPAYER_LOOKUP_URL: ${HACIENDA_TAXPAYER_LOOKUP_URL:-https://api.hacienda.go.cr/fe/ae?identificacion={identification}}
      GEOCODING_SEARCH_URL: ${GEOCODING_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
    depends_on:
      - db
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksys}
      POSTGRES_USER: ${POSTGRES_USER:-tracksys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
