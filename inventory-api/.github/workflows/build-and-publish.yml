name: build-and-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional release version override (for example v1.0.0)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Run repository quality gates
        run: npm run verify

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            RELEASE_VERSION="${GITHUB_REF_NAME}"
          elif [ -n "${{ github.event.inputs.release_version }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.release_version }}"
          else
            RELEASE_VERSION="v${PACKAGE_VERSION}-${SHORT_SHA}"
          fi

          IMAGE_REPOSITORY="inventory-api"
          IMAGE_TAG="${RELEASE_VERSION#v}"
          ARTIFACT_BASENAME="inventory-api-${RELEASE_VERSION}"

          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "image_repository=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "artifact_basename=${ARTIFACT_BASENAME}" >> "$GITHUB_OUTPUT"

      - name: Build versioned Docker image
        run: |
          docker build \
            --tag "${{ steps.release.outputs.image_repository }}:${{ steps.release.outputs.image_tag }}" \
            --tag "${{ steps.release.outputs.image_repository }}:${{ steps.release.outputs.short_sha }}" \
            .

      - name: Package release artifacts
        shell: bash
        run: |
          mkdir -p dist

          docker save "${{ steps.release.outputs.image_repository }}:${{ steps.release.outputs.image_tag }}" \
            | gzip > "dist/${{ steps.release.outputs.artifact_basename }}.docker-image.tar.gz"

          sha256sum "dist/${{ steps.release.outputs.artifact_basename }}.docker-image.tar.gz" \
            > "dist/${{ steps.release.outputs.artifact_basename }}.sha256"

          cat > "dist/${{ steps.release.outputs.artifact_basename }}.metadata.json" <<EOF
          {
            "releaseVersion": "${{ steps.release.outputs.release_version }}",
            "packageVersion": "${{ steps.release.outputs.package_version }}",
            "gitSha": "${{ steps.release.outputs.short_sha }}",
            "imageRepository": "${{ steps.release.outputs.image_repository }}",
            "imageTag": "${{ steps.release.outputs.image_tag }}",
            "publishMode": "github-artifact",
            "deployIncluded": false
          }
          EOF

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact_basename }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
