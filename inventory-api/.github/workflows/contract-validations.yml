name: contract-validations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-validations:
    name: contract-validations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run build

      - name: Validate embedded public runtime
        run: npm run validate:public-runtime

      - name: Validate workflow baseline
        run: npm run validate:workflow-baseline

      - name: Validate operational readiness
        run: npm run validate:operational-readiness
