<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventori | Responder cotización</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .supplier-quote-page {
        max-width: 720px;
        margin: 0 auto;
        padding: 24px 16px;
      }
      .supplier-quote-page .card {
        margin-bottom: 24px;
      }
      .supplier-quote-hero {
        text-align: center;
        margin-bottom: 24px;
      }
      .supplier-quote-hero h1 {
        font-size: 1.5rem;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .supplier-quote-hero p {
        color: var(--muted);
      }
      .supplier-quote-items-table input[type="number"] {
        width: 100%;
        min-width: 80px;
      }
      .supplier-quote-error {
        text-align: center;
        padding: 40px 16px;
      }
      .supplier-quote-success {
        text-align: center;
        padding: 40px 16px;
      }
      .supplier-quote-success h2 {
        color: #116329;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="supplier-quote-page" id="supplier-quote-app">
      <div class="supplier-quote-hero">
        <span class="brand-mark" aria-hidden="true">I</span>
        <h1>Inventori — Cotización</h1>
        <p>Responda la solicitud de cotización a continuación.</p>
      </div>
      <div id="supplier-quote-message"></div>
      <div id="supplier-quote-content">
        <p class="empty-state">Cargando solicitud...</p>
      </div>
    </div>
    <script src="/supplier-quote/app.js"></script>
  </body>
</html>
