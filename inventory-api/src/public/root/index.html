<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventori | Root</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page-layout">
      <section class="card">
        <header class="page-header">
          <div>
            <p class="eyebrow">Inventori</p>
            <h1>Empresas</h1>
            <p id="root-session" class="muted">Sesion activa</p>
          </div>
          <button id="logout-button" class="secondary-button" type="button">Cerrar sesion</button>
        </header>

        <section class="calculator-section">
          <div class="section-title-row">
            <h2>Crear empresa</h2>
          </div>

          <form id="company-form" class="pricing-form">
            <section class="pricing-grid">
              <label class="field">
                <span>Nombre empresa</span>
                <input name="companyName" type="text" placeholder="inventori" required />
              </label>
              <label class="field">
                <span>Identificacion empresa</span>
                <input name="companyLegalId" type="text" placeholder="3-101-000000" />
              </label>
              <label class="field">
                <span>Correo empresa</span>
                <input name="companyEmail" type="email" placeholder="empresa@inventori.local" />
              </label>
              <label class="field">
                <span>Telefono empresa</span>
                <input name="companyPhone" type="text" placeholder="2222-2222" />
              </label>
              <label class="field field-wide">
                <span>Direccion empresa</span>
                <input name="companyAddress" type="text" placeholder="San Jose, Costa Rica" />
              </label>
            </section>

            <section class="pricing-grid">
              <label class="field">
                <span>Razon social fiscal</span>
                <input name="legalName" type="text" required />
              </label>
              <label class="field">
                <span>Nombre comercial</span>
                <input name="commercialName" type="text" />
              </label>
              <label class="field">
                <span>Tipo identificacion</span>
                <input name="identificationType" type="text" value="02" required />
              </label>
              <label class="field">
                <span>Numero identificacion</span>
                <input name="identificationNumber" type="text" required />
              </label>
              <label class="field">
                <span>Actividad economica</span>
                <input name="economicActivityCode" type="text" />
              </label>
              <label class="field">
                <span>Ambiente Hacienda</span>
                <select name="haciendaEnvironment">
                  <option value="STAGING">Pruebas</option>
                  <option value="PRODUCTION">Produccion</option>
                </select>
              </label>
              <label class="field">
                <span>Sucursal</span>
                <input name="defaultBranchCode" type="text" value="001" minlength="3" maxlength="3" required />
              </label>
              <label class="field">
                <span>Terminal</span>
                <input name="defaultTerminalCode" type="text" value="00001" minlength="5" maxlength="5" required />
              </label>
            </section>

            <section class="pricing-grid">
              <label class="field">
                <span>Nombre root</span>
                <input name="rootFullName" type="text" required />
              </label>
              <label class="field">
                <span>Usuario root</span>
                <input name="rootUsername" type="text" required />
              </label>
              <label class="field">
                <span>Correo root</span>
                <input name="rootEmail" type="email" />
              </label>
              <label class="field">
                <span>Telefono root</span>
                <input name="rootPhone" type="text" />
              </label>
              <label class="field">
                <span>Contrasena root</span>
                <input name="rootPassword" type="password" minlength="8" required />
              </label>
            </section>

            <div class="import-actions">
              <button id="create-company-button" type="submit">Crear empresa</button>
              <p id="company-message" class="message" aria-live="polite"></p>
            </div>
          </form>
        </section>

        <section class="calculator-section">
          <div class="section-title-row">
            <h2>Empresas creadas</h2>
            <button id="refresh-companies-button" class="secondary-button" type="button">Actualizar</button>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Identificacion</th>
                  <th>Estado</th>
                  <th>Ambiente</th>
                  <th>Root</th>
                </tr>
              </thead>
              <tbody id="companies-body"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script src="/root/index.js"></script>
  </body>
</html>
