<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventori | Detalle cliente</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Inventori</p>
          <h2>Empresa</h2>
        </div>
        <nav class="sidebar-nav" aria-label="Navegacion principal">
          <a class="sidebar-link" href="/root/dashboard.html">Dashboard</a>
          <a class="sidebar-link" href="/root/users.html">Usuarios</a>
          <a class="sidebar-link" href="/root/roles.html">Roles</a>
          <a class="sidebar-link" href="/root/warehouses.html">Bodegas</a>
          <a class="sidebar-link" href="/root/products.html">Productos</a>
          <a class="sidebar-link" href="/root/zones.html">Zonas</a>
          <a class="sidebar-link" href="/root/routes.html">Rutas</a>
          <a class="sidebar-link active" href="/root/clients.html">Clientes</a>
          <a class="sidebar-link" href="/root/invoice-inconsistencies.html">Revision de facturas</a>
        </nav>
      </aside>

      <section class="card app-content">
        <header class="page-header">
          <div>
            <p class="eyebrow">Cliente</p>
            <h1 id="client-title">Detalle del cliente</h1>
            <p id="client-detail-session" class="muted">Sesion activa</p>
          </div>
          <div class="import-actions">
            <a class="secondary-button table-action-link" href="/root/clients.html">Volver</a>
            <button id="logout-button" class="secondary-button" type="button">Cerrar sesion</button>
          </div>
        </header>

        <p id="client-detail-message" class="message" aria-live="polite"></p>

        <section id="client-summary" class="detail-summary"></section>

        <nav class="tabs-nav" aria-label="Secciones del cliente">
          <button class="tab-button active" type="button" data-tab="general">Datos generales</button>
          <button class="tab-button" type="button" data-tab="stores">Tiendas</button>
          <button class="tab-button" type="button" data-tab="people">Representantes</button>
          <button class="tab-button" type="button" data-tab="documents">Documentos</button>
          <button class="tab-button" type="button" data-tab="references">Referencias</button>
          <button class="tab-button" type="button" data-tab="credit">Credito</button>
        </nav>

        <section id="tab-general" class="tab-panel"></section>
        <section id="tab-stores" class="tab-panel hidden"></section>
        <section id="tab-people" class="tab-panel hidden"></section>
        <section id="tab-documents" class="tab-panel hidden"></section>
        <section id="tab-references" class="tab-panel hidden"></section>
        <section id="tab-credit" class="tab-panel hidden"></section>
      </section>
    </main>

    <script src="/root/root-sidebar.js"></script>
    <script src="/root/client-detail.shared.js"></script>
    <script src="/root/client-detail.renderers.js"></script>
    <script src="/root/client-detail.references.js"></script>
    <script src="/root/client-detail.js"></script>
  </body>
</html>
