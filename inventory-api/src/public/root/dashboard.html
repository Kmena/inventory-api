<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inventori | Dashboard ejecutivo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar">
        <div>
          <p class="eyebrow">Inventori</p>
          <h2>Empresa</h2>
        </div>
        <nav class="sidebar-nav" aria-label="Navegacion principal">
          <a class="sidebar-link active" href="/root/dashboard.html">Dashboard</a>
          <a class="sidebar-link" href="/root/users.html">Usuarios</a>
          <a class="sidebar-link" href="/root/roles.html">Roles</a>
        </nav>
      </aside>

      <section class="card app-content">
        <header class="page-header">
          <div>
            <p class="eyebrow">Dashboard ejecutivo</p>
            <h1 id="company-name">Empresa</h1>
            <p id="root-session" class="muted">Sesion activa</p>
          </div>
          <button id="logout-button" class="secondary-button" type="button">Cerrar sesion</button>
        </header>

        <p id="dashboard-message" class="message" aria-live="polite"></p>

        <section class="dashboard-grid executive-dashboard-grid" aria-label="Resumen ejecutivo">
          <article class="dashboard-tile">
            <span>Empleados registrados</span>
            <strong id="employees-count">0</strong>
          </article>
          <article class="dashboard-tile">
            <span>Estado de empresa</span>
            <strong id="company-status">-</strong>
          </article>
          <article class="dashboard-tile">
            <span>Identificacion</span>
            <strong id="company-legal-id">-</strong>
          </article>
        </section>

        <section class="executive-summary">
          <div class="section-title-row">
            <h2>Descripcion de la empresa</h2>
          </div>
          <p id="company-description" class="muted">Cargando descripcion...</p>
        </section>
      </section>
    </main>

    <script src="/root/dashboard.js"></script>
  </body>
</html>
