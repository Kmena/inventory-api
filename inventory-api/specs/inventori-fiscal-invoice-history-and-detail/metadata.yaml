feature: inventori-fiscal-invoice-history-and-detail
title: "Inventori Fiscal Invoice History & Detail"
description: >
  Extends the existing Facturación y Cobros experience so users can see the
  commercial AND fiscal state of invoices already generated by the existing
  dispatch/fiscal pipeline. Adds fiscal status to the invoice list, a proper
  invoice detail panel, all six fiscal lifecycle states, clave/consecutive/
  acceptedAt when applicable, and fiscal artifact downloads (PDF, signed XML,
  Hacienda response XML). All fiscal data is projected through a browser-safe
  DTO — raw InvoiceFiscalIntent internals are never exposed.

status: in_progress
implementation_status: wave_2_complete

