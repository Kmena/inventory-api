# Deprecated development Compose file kept only as a compatibility bridge.
# Use inventory-api/docker-compose.dev.yml instead.
# Canonical startup command from inventory-api/: docker compose -f docker-compose.dev.yml up --build
services:
  app:
    build:
      context: ../inventory-api
      dockerfile: Dockerfile
    ports:
      - "${PORT:-2500}:2500"
    env_file:
      - ../inventory-api/.env
    environment:
      PORT: ${PORT:-2500}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:2500}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:2500}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    depends_on:
      - db
    volumes:
      - ../inventory-api:/app
      - /app/node_modules
      - uploads_data:/app/back_end/Top_end/uploads
      - images_data:/app/front_end/assets/img

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tracksys}
      POSTGRES_USER: ${POSTGRES_USER:-tracksys}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads_data:
  images_data: